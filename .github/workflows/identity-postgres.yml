name: Identity and purchases PostgreSQL laboratory
on:
  workflow_dispatch:
  push:
    branches: [feature/daniel-identity-users, feature/jesus-customers-crud]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  identity-postgres:
    if: >
      github.repository == 'carloscamelo2008-lang/la-exclusiva-p3' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.pull_request.head.ref == 'feature/daniel-identity-users' ||
         github.event.pull_request.head.ref == 'feature/identity-app-integration' ||
         github.event.pull_request.head.ref == 'feature/purchases-app-integration' ||
         github.event.pull_request.head.ref == 'feature/smart-reminders-security' ||
         (github.event.pull_request.number == 29 && github.event.pull_request.head.ref == 'feature/jesus-customers-crud'))) ||
       (github.event_name == 'push' && (github.ref == 'refs/heads/feature/daniel-identity-users' ||
                                        github.ref == 'refs/heads/feature/jesus-customers-crud')) ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/feature/daniel-identity-users' ||
         github.ref == 'refs/heads/feature/identity-app-integration' ||
         github.ref == 'refs/heads/feature/purchases-app-integration' ||
         github.ref == 'refs/heads/feature/smart-reminders-security' ||
         github.ref == 'refs/heads/feature/jesus-customers-crud')))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IDENTITY_LAB_AUTHORIZED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/jesus-customers-crud' || github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/jesus-customers-crud') && 'pr29-customers' || ((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/smart-reminders-security') || github.ref == 'refs/heads/feature/smart-reminders-security') && 'collections' || (((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/purchases-app-integration') || github.ref == 'refs/heads/feature/purchases-app-integration') && 'purchases') || (((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/identity-app-integration') || github.ref == 'refs/heads/feature/identity-app-integration') && 'pr24') || 'pr22' }}
      LAEXCLUSIVA_PG18_IMAGE: postgres:18-bookworm@sha256:194e55feb2597b1465dbee81cc9fd8d204566cd2eb42c8d22fd6c931a38781b1
      LAEXCLUSIVA_JAVA17_IMAGE: maven:3.9-eclipse-temurin-17@sha256:1a352420f7aba21f5ad08df31bab55f74c013fb491f1ae8ab1dd7ff9ed698584
      LAB_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java 17 and restore the Maven artifact cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Initialize job-local laboratory path
        run: echo "LAB_ROOT=$RUNNER_TEMP/identity-pg-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Execute isolated migrations, integrations and recovery
        run: python3 database/validation/identity/actions-lab.py
      - name: Destroy only this job's laboratory
        if: always()
        run: python3 database/validation/identity/actions-lab.py --cleanup
      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LAB_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 14
